[build]
  publish = "public"

# páginas próprias de cada carro, marca e lista (para o Google) e o sitemap.xml: netlify/functions/paginas.mjs
# o esbuild junta numa peça só a função e os arquivos de netlify/lib que ela usa
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# o endereço antigo leva ao domínio próprio (um só endereço para o Google e para as visitas).
# Só vale para autokan.netlify.app: as prévias (deploy-preview-N--autokan.netlify.app) continuam abrindo normalmente.
[[redirects]]
  from = "https://autokan.netlify.app/*"
  to = "https://autokan.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Salvos tem endereço próprio, mas é a mesma página da roleta (os salvos são de cada pessoa, montados no navegador)
[[redirects]]
  from = "/salvos"
  to = "/index.html"
  status = 200

# endereço antigo da página (antes "Minha garagem")
[[redirects]]
  from = "/garagem"
  to = "/salvos"
  status = 301

# CDN de imagens do Netlify: entrega as fotos do Supabase em tamanho reduzido
[images]
  remote_images = ["https://ljgcvxadsekaicffztbi\\.supabase\\.co/storage/v1/object/public/.*"]

# manifesto do app (nome e ícones do atalho na tela inicial) com o tipo certo
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# bibliotecas servidas pelo próprio site (antes vinham de um CDN externo; se ele falhasse, a roleta não abria).
# O nome do arquivo leva a versão, então pode ficar guardado por 1 ano.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ícone do site (o Google e os navegadores procuram em /favicon.ico)
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"
